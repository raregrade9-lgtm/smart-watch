<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse Watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
:root{
  --page:#e9ecf2; --page2:#cfd5e2; --text:#1b2030; --muted:#5d667c;
  --case1:#c9ced8; --case2:#8e95a6; --strap:#2a3042; --strapHi:#3a425a;
  --screen:#000; --ink:#f4f6fb; --dim:#7f889d;
  --move:#ff3b6b; --exer:#b6ff3c; --stand:#2fe4ff; --heart:#ff4d5e;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page:#10131c;--page2:#060810;--text:#e8ebf4;--muted:#8a93aa;--case1:#6c7386;--case2:#3a4052;--strap:#1b2031;--strapHi:#2a3149}
}
:root[data-theme="dark"]{--page:#10131c;--page2:#060810;--text:#e8ebf4;--muted:#8a93aa;--case1:#6c7386;--case2:#3a4052;--strap:#1b2031;--strapHi:#2a3149}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(circle at 50% 35%,var(--page),var(--page2));color:var(--text);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;padding:24px 12px}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;transform-origin:top center;touch-action:pan-y}
.strap{width:150px;height:110px;background:linear-gradient(90deg,var(--strap),var(--strapHi) 50%,var(--strap));
  background-image:repeating-linear-gradient(0deg,transparent 0 14px,rgba(0,0,0,.25) 14px 16px),linear-gradient(90deg,var(--strap),var(--strapHi) 50%,var(--strap))}
.strap.top{border-radius:34px 34px 0 0;margin-bottom:-8px}
.strap.bot{border-radius:0 0 34px 34px;margin-top:-8px;height:130px}
.case{position:relative;width:272px;height:328px;border-radius:76px;padding:14px;z-index:2;
  background:linear-gradient(145deg,var(--case1),var(--case2));
  box-shadow:0 30px 60px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.35)}
.crown{position:absolute;right:-12px;top:78px;width:18px;height:58px;border-radius:0 9px 9px 0;border:0;cursor:pointer;
  background:repeating-linear-gradient(0deg,var(--case1) 0 3px,var(--case2) 3px 6px);box-shadow:2px 2px 6px rgba(0,0,0,.35)}
.crown:active{transform:translateX(-3px)}
.side{position:absolute;right:-8px;top:170px;width:12px;height:42px;border-radius:0 6px 6px 0;border:0;cursor:pointer;background:var(--case2);box-shadow:2px 2px 4px rgba(0,0,0,.3)}
.side:active{transform:translateX(-2px)}
.crown:focus-visible,.side:focus-visible,.btn:focus-visible,.dots button:focus-visible{outline:3px solid var(--stand);outline-offset:3px}
.screen{position:relative;width:100%;height:100%;border-radius:62px;background:var(--screen);overflow:hidden;color:var(--ink);transition:filter .4s}
.screen.sleep{filter:brightness(.12)}
.pane{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .35s cubic-bezier(.3,.8,.3,1),opacity .3s;opacity:0;pointer-events:none}
.pane.on{opacity:1;pointer-events:auto;transform:none}
.pane.l{transform:translateX(-100%)}.pane.r{transform:translateX(100%)}
.tnum{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* face */
.face .time{font-size:78px;font-weight:600;line-height:.9;display:flex;align-items:flex-start;gap:2px}
.face .sec{font-size:26px;color:var(--move);margin-top:6px;width:30px}
.face .date{font-size:17px;color:var(--dim);margin-top:6px}
.comps{display:flex;gap:10px;margin-top:20px}
.comp{width:62px;height:62px;border-radius:50%;background:#12151e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:600;line-height:1}
.comp small{font-size:11px;font-weight:500;color:var(--dim);margin-top:3px}
.analog{display:none}
.face.analog-on .digital{display:none}.face.analog-on .analog{display:block}
.analog svg{width:215px;height:215px}

/* activity */
.rings svg{width:178px;height:178px;transform:rotate(-90deg)}
.rings circle{fill:none;stroke-linecap:round;stroke-width:15}
.rings .bg{opacity:.2}
.rings .fg{transition:stroke-dashoffset .8s ease}
.legend{display:grid;grid-template-columns:auto auto auto;gap:14px;margin-top:12px;text-align:center;font-size:20px;font-weight:600}
.legend small{display:block;font-size:11px;font-weight:500;color:var(--dim)}

/* heart */
.hr{font-size:84px;font-weight:700;line-height:.9;color:var(--heart)}
.heart{width:30px;height:30px;color:var(--heart);animation:beat var(--beat,.8s) infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.14)}}
.ecg{width:210px;height:60px;margin-top:10px}
.ecg path{fill:none;stroke:var(--heart);stroke-width:2.2;stroke-linejoin:round}
.zone{font-size:14px;color:var(--dim);margin-top:6px}

/* stopwatch */
.sw{font-size:62px;font-weight:600}
.sw span{font-size:36px;color:var(--exer)}
.row{display:flex;gap:14px;margin-top:14px}
.btn{width:66px;height:66px;border-radius:50%;border:0;font:600 17px "Barlow",sans-serif;cursor:pointer;color:#fff}
.btn.go{background:#12351c;color:var(--exer)}.btn.stop{background:#3a1220;color:var(--move)}.btn.lap{background:#242a3a}
.btn:active{transform:scale(.94)}
.laps{height:34px;margin-top:8px;font-size:14px;color:var(--dim);text-align:center;overflow:hidden}

/* timer / weather-like quick tile */
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:3}
.dots button{width:8px;height:8px;padding:0;border-radius:50%;border:0;background:#3b4258;cursor:pointer}
.dots button.on{background:#fff;width:20px;border-radius:4px;transition:width .25s}
.toast{position:absolute;top:22px;left:50%;transform:translate(-50%,-80px);background:#1d2232;color:var(--ink);padding:7px 14px;border-radius:20px;font-size:14px;z-index:4;transition:transform .35s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.hint{max-width:340px;text-align:center;color:var(--muted);font-size:15px;line-height:1.45}
.hint b{color:var(--text);font-weight:500}
.themebtn{border:1px solid var(--muted);background:none;color:var(--text);border-radius:20px;padding:6px 16px;font:500 14px "Barlow",system-ui,sans-serif;cursor:pointer}
@media (max-height:760px){.stage{transform:scale(.82)}.stage{margin:-60px 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="strap top"></div>
  <div class="case">
    <button class="crown" id="crown" aria-label="Next screen"></button>
    <button class="side" id="side" aria-label="Wake or sleep screen"></button>
    <div class="screen" id="screen">
      <div class="toast" id="toast"></div>

      <section class="pane face on" id="p0" aria-label="Watch face">
        <div class="digital" id="digital" style="text-align:center">
          <div class="time tnum" style="justify-content:center"><span id="hm">10:09</span><span class="sec" id="ss">00</span></div>
          <div class="date" id="date"></div>
          <div class="comps">
            <div class="comp tnum"><span id="cBat">82</span><small>battery</small></div>
            <div class="comp tnum"><span id="cSteps">4.2k</span><small>steps</small></div>
            <div class="comp tnum" style="color:var(--heart)"><span id="cHr">72</span><small>bpm</small></div>
          </div>
        </div>
        <div class="analog" id="analog">
          <svg viewBox="-100 -100 200 200" aria-hidden="true">
            <g id="ticks"></g>
            <text x="0" y="-38" text-anchor="middle" fill="#7f889d" font-size="11" font-family="Barlow,sans-serif" id="aDate"></text>
            <line id="hh" x1="0" y1="6" x2="0" y2="-48" stroke="#f4f6fb" stroke-width="6" stroke-linecap="round"/>
            <line id="mh" x1="0" y1="8" x2="0" y2="-72" stroke="#f4f6fb" stroke-width="4" stroke-linecap="round"/>
            <line id="sh" x1="0" y1="14" x2="0" y2="-80" stroke="#ff3b6b" stroke-width="2" stroke-linecap="round"/>
            <circle r="5" fill="#ff3b6b"/>
          </svg>
        </div>
      </section>

      <section class="pane r rings" id="p1" aria-label="Activity">
        <svg viewBox="0 0 180 180" aria-hidden="true">
          <circle class="bg" cx="90" cy="90" r="80" stroke="var(--move)"/><circle class="fg" id="r0" cx="90" cy="90" r="80" stroke="var(--move)"/>
          <circle class="bg" cx="90" cy="90" r="61" stroke="var(--exer)"/><circle class="fg" id="r1" cx="90" cy="90" r="61" stroke="var(--exer)"/>
          <circle class="bg" cx="90" cy="90" r="42" stroke="var(--stand)"/><circle class="fg" id="r2" cx="90" cy="90" r="42" stroke="var(--stand)"/>
        </svg>
        <div class="legend tnum">
          <div style="color:var(--move)"><span id="vMove">312</span><small>kcal</small></div>
          <div style="color:var(--exer)"><span id="vEx">18</span><small>min</small></div>
          <div style="color:var(--stand)"><span id="vSt">7</span><small>hrs</small></div>
        </div>
      </section>

      <section class="pane r" id="p2" aria-label="Heart rate" style="text-align:center">
        <svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 2.8 4.5 6.4 4.5c2 0 3.7 1.1 5.6 3.3 1.9-2.2 3.6-3.3 5.6-3.3 3.6 0 5.5 3.8 4 7.2C19.500 16.400 12 21 12 21z"/></svg>
        <div class="hr tnum" id="bpm">72</div>
        <div class="zone" id="zone">Resting</div>
        <svg class="ecg" viewBox="0 0 210 60" aria-hidden="true"><path id="ecg" d=""/></svg>
      </section>

      <section class="pane r" id="p3" aria-label="Stopwatch" style="text-align:center">
        <div class="sw tnum" id="sw">00:00<span>.00</span></div>
        <div class="laps tnum" id="laps">Press start</div>
        <div class="row">
          <button class="btn lap" id="lapBtn">Lap</button>
          <button class="btn go" id="goBtn">Start</button>
        </div>
      </section>

      <div class="dots" id="dots"></div>
    </div>
  </div>
  <div class="strap bot"></div>
</div>

<p class="hint"><b>Swipe</b> the screen, press the <b>crown</b>, or use the arrow keys to change screens. Tap the time to switch between digital and analog. Press the side button to sleep or wake.</p>
<button class="themebtn" id="themeBtn">Switch theme</button>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var pad=function(n,l){return String(n).padStart(l||2,"0")};
  var panes=[0,1,2,3].map(function(i){return $("p"+i)});
  var cur=0, asleep=false, steps=4210, bat=82, bpm=72;

  /* dots */
  var dots=$("dots");
  panes.forEach(function(_,i){
    var b=document.createElement("button");b.setAttribute("aria-label","Screen "+(i+1));
    b.onclick=function(){go(i)};dots.appendChild(b);
  });
  function go(n){
    n=(n+panes.length)%panes.length;
    panes.forEach(function(p,i){
      p.classList.remove("on","l","r");
      if(i===n)p.classList.add("on");else p.classList.add(i<n?"l":"r");
    });
    [].forEach.call(dots.children,function(d,i){d.classList.toggle("on",i===n)});
    cur=n;wake();
    if(n===1)drawRings();
  }

  /* clock */
  var days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],mons=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var ticks=$("ticks"),t="";
  for(var i=0;i<60;i++){var a=i*6*Math.PI/180,big=i%5===0,r1=big?84:90;
    t+='<line x1="'+(Math.sin(a)*r1).toFixed(1)+'" y1="'+(-Math.cos(a)*r1).toFixed(1)+'" x2="'+(Math.sin(a)*96).toFixed(1)+'" y2="'+(-Math.cos(a)*96).toFixed(1)+'" stroke="'+(big?"#f4f6fb":"#4a5268")+'" stroke-width="'+(big?3:1.2)+'"/>';}
  ticks.innerHTML=t;
  function tick(){
    var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
    $("hm").textContent=pad(h)+":"+pad(m);$("ss").textContent=pad(s);
    var ds=days[d.getDay()]+" "+d.getDate()+" "+mons[d.getMonth()];
    $("date").textContent=ds;$("aDate").textContent=ds;
    $("hh").setAttribute("transform","rotate("+((h%12)*30+m/2)+")");
    $("mh").setAttribute("transform","rotate("+(m*6+s/10)+")");
    $("sh").setAttribute("transform","rotate("+(s*6)+")");
  }
  tick();setInterval(tick,1000);
  $("p0").addEventListener("click",function(){$("p0").classList.toggle("analog-on")});

  /* complications + activity */
  function fmtSteps(){return steps>=1000?(steps/1000).toFixed(1)+"k":steps}
  var goals={move:500,ex:30,st:12},act={move:312,ex:18,st:7};
  var C=[80,61,42].map(function(r){return 2*Math.PI*r});
  function drawRings(){
    var v=[act.move/goals.move,act.ex/goals.ex,act.st/goals.st];
    v.forEach(function(x,i){var el=$("r"+i);el.style.strokeDasharray=C[i];el.style.strokeDashoffset=C[i]*(1-Math.min(x,1));});
    $("vMove").textContent=Math.round(act.move);$("vEx").textContent=Math.round(act.ex);$("vSt").textContent=act.st;
  }
  function refreshComps(){$("cBat").textContent=Math.round(bat);$("cSteps").textContent=fmtSteps();$("cHr").textContent=bpm}
  setInterval(function(){
    steps+=Math.floor(Math.random()*9);act.move+=Math.random()*.6;
    if(Math.random()<.08)act.ex+=1;
    if(Math.random()<.01&&act.st<12)act.st++;
    bat=Math.max(5,bat-.01);refreshComps();if(cur===1)drawRings();
  },2000);
  /* keep bpm believable */
  var target=72;
  setInterval(function(){
    if(Math.random()<.15)target=62+Math.floor(Math.random()*40);
    bpm+=Math.sign(target-bpm)*(Math.random()<.7?1:0)+(Math.random()<.3?(Math.random()<.5?-1:1):0);
    bpm=Math.max(54,Math.min(140,bpm));
    $("bpm").textContent=bpm;$("cHr").textContent=bpm;
    $("zone").textContent=bpm<80?"Resting":bpm<105?"Light":bpm<125?"Fat burn":"Peak";
    document.querySelector(".heart").style.setProperty("--beat",(60/bpm).toFixed(2)+"s");
  },1500);
  refreshComps();drawRings();

  /* ECG trace */
  var ecgPts=[],x=0,phase=0;
  for(var i=0;i<105;i++)ecgPts.push(30);
  setInterval(function(){
    var y=30,p=phase%22;
    if(p===3)y=24;else if(p===4)y=30;else if(p===7)y=36;else if(p===8)y=4;else if(p===9)y=54;else if(p===10)y=30;else if(p===15)y=22;else if(p===16)y=20;else if(p===17)y=24;
    y+=(Math.random()-.5)*1.5;
    phase++;ecgPts.push(y);ecgPts.shift();
    $("ecg").setAttribute("d",ecgPts.map(function(v,i){return(i?"L":"M")+(i*2).toFixed(0)+" "+v.toFixed(1)}).join(" "));
  },70);

  /* stopwatch */
  var running=false,start=0,acc=0,laps=[],raf;
  function elapsed(){return acc+(running?performance.now()-start:0)}
  function fmt(ms){var c=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return pad(m)+":"+pad(s)+"<span>."+pad(c)+"</span>"}
  function loop(){$("sw").innerHTML=fmt(elapsed());if(running)raf=requestAnimationFrame(loop)}
  $("goBtn").onclick=function(){
    wake();
    if(!running){running=true;start=performance.now();this.textContent="Stop";this.className="btn stop";$("lapBtn").textContent="Lap";loop();}
    else{acc+=performance.now()-start;running=false;this.textContent="Start";this.className="btn go";$("lapBtn").textContent="Reset";cancelAnimationFrame(raf);loop();}
  };
  $("lapBtn").onclick=function(){
    wake();
    if(running){laps.unshift(elapsed());$("laps").textContent="Lap "+laps.length+"  "+$("sw").textContent;}
    else{acc=0;laps=[];$("sw").innerHTML=fmt(0);$("laps").textContent="Press start";this.textContent="Lap";}
  };

  /* controls */
  $("crown").onclick=function(){go(cur+1);buzz()};
  $("side").onclick=function(){asleep?wake():sleep()};
  document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"){go(cur+1)}else if(e.key==="ArrowLeft"){go(cur-1)}
  });
  var sx=null;
  var scr=$("screen");
  scr.addEventListener("pointerdown",function(e){sx=e.clientX});
  scr.addEventListener("pointerup",function(e){
    if(sx===null)return;var dx=e.clientX-sx;sx=null;
    if(Math.abs(dx)>40){go(cur+(dx<0?1:-1))}
  });
  function buzz(){if(navigator.vibrate){try{navigator.vibrate(12)}catch(e){}}}

  /* sleep after idle */
  var idle;
  function wake(){asleep=false;scr.classList.remove("sleep");clearTimeout(idle);idle=setTimeout(sleep,45000)}
  function sleep(){asleep=true;scr.classList.add("sleep")}
  scr.addEventListener("click",wake);
  wake();

  /* notification toast once */
  setTimeout(function(){var t=$("toast");t.textContent="Stand goal: 1 hour to go";t.classList.add("show");setTimeout(function(){t.classList.remove("show")},3200)},4000);

  /* theme */
  $("themeBtn").onclick=function(){
    var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
    r.setAttribute("data-theme",dark?"light":"dark");
  };
  go(0);
})();
</script>
</body>
</html>
